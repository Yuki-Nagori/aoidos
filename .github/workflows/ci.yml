# CI：三平台各一条流水线，与本地 verify 同一组门禁。
# 与本地 verify 的差异（省两次 Rust 编译形态，语义不变）：
#   - cargo check 不单跑——clippy 已包含类型检查；
#   - cargo test 不单跑——llvm-cov 会先跑一遍测试，同一插桩编译同时验证测试与 100% 行覆盖。
#     若测试失败 coverage 步骤直接失败；行覆盖门槛失守时日志带未覆盖行号。
name: CI

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!ai-docs/**"
      - "!**/*.md"
      # 内嵌剧本改变编译产物与 prompt，必须复验；文档 Markdown 仍不触发。
      - "resources/scripts/**"
  pull_request:
    paths:
      - "**"
      - "!ai-docs/**"
      - "!**/*.md"
      # 内嵌剧本改变编译产物与 prompt，必须复验；文档 Markdown 仍不触发。
      - "resources/scripts/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@master
        with:
          # 与 rust-toolchain.toml 保持一致
          toolchain: "1.99.0"
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          # 失败也保留依赖编译缓存，修复格式或测试后无需重编依赖；工作区源码仍重新检查。
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: 安装依赖（postinstall 做环境自检）
        run: bun install --frozen-lockfile
      - name: typecheck（前端 + 仓库脚本）
        run: bun run typecheck
      - name: lint（eslint）
        run: bun run lint
      - name: format（prettier）
        run: bun run format:check
      - name: format（rustfmt）
        run: bun run format:rust:check
      - name: test + coverage（vitest）
        run: bun run test:coverage
      - name: 死代码检查（knip）
        run: bun run knip
      - name: bench（tinybench 链路可用）
        run: bun run bench
      - name: build（vite 生产构建）
        run: bun run build:web
      # 前端快速门禁先完成；rustdoc / clippy 前先补齐 Linux 原生依赖。
      - name: 安装 Tauri Linux 依赖
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            xvfb dbus-x11 gnome-keyring
      - name: doc（rustdoc 拒绝警告）
        run: bun run doc:rust
      - name: lint（clippy + cargo check）
        run: bun run lint:rust
      - name: test + coverage 门槛（cargo-llvm-cov）
        run: bun run coverage:rust

      - name: 原生 UI / 凭据与主 Webview IPC 验证（macOS / Windows）
        if: matrix.os != 'ubuntu-latest'
        timeout-minutes: 5
        run: bun run test:native
      - name: 原生 UI / Secret Service 与主 Webview IPC 验证（Linux）
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 5
        run: |
          dbus-run-session -- bash -c '
            printf "aoidos-session-fixture" | gnome-keyring-daemon --unlock --components=secrets
            xvfb-run -a bun run test:native
          '
