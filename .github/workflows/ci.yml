# 日常 CI 在 Ubuntu 执行共享质量门禁与受影响构建 / 验证；macOS / Windows 完整覆盖由 nightly 执行。
name: CI

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!ai-docs/**"
      - "!**/*.md"
      - "resources/scripts/**"
  pull_request:
    paths:
      - "**"
      - "!ai-docs/**"
      - "!**/*.md"
      - "resources/scripts/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: detect affected checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      full: ${{ steps.plan.outputs.full }}
      has_rust_test: ${{ steps.plan.outputs.has_rust_test }}
      has_vitest: ${{ steps.plan.outputs.has_vitest }}
      has_format: ${{ steps.plan.outputs.has_format }}
      has_lint: ${{ steps.plan.outputs.has_lint }}
      has_layers: ${{ steps.plan.outputs.has_layers }}
      has_desktop_clippy: ${{ steps.plan.outputs.has_desktop_clippy }}
      has_app_build: ${{ steps.plan.outputs.has_app_build }}
      has_native: ${{ steps.plan.outputs.has_native }}
    steps:
      - uses: actions/checkout@v4
        with:
          # PR merge commit 与 push before SHA 都可见；基线不可信时 selector 回退全量。
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - id: plan
        name: Build shared test, format and lint plan
        env:
          AOIDOS_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          AOIDOS_CI_HEAD_SHA: ${{ github.sha }}
        run: bun scripts/ci-scope.mts output

  quality:
    name: shared quality gates (ubuntu)
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-aoidos
        with:
          rust-components: rustfmt,clippy
      - name: Typecheck
        run: bun run typecheck
      - name: Format affected files
        if: needs.changes.outputs.has_format == 'true'
        uses: ./.github/actions/run-scope
        with:
          task: format
          plan: ${{ needs.changes.outputs.plan }}
      - name: Lint affected files
        if: needs.changes.outputs.has_lint == 'true'
        uses: ./.github/actions/run-scope
        with:
          task: web-lint
          plan: ${{ needs.changes.outputs.plan }}
      - name: Check Rust dependency layers
        if: needs.changes.outputs.has_layers == 'true'
        uses: ./.github/actions/run-scope
        with:
          task: layers
          plan: ${{ needs.changes.outputs.plan }}
      - uses: ./.github/actions/linux-desktop-deps
        if: needs.changes.outputs.has_desktop_clippy == 'true'
      - name: Clippy affected workspace packages
        if: needs.changes.outputs.has_lint == 'true'
        uses: ./.github/actions/run-scope
        with:
          task: clippy
          plan: ${{ needs.changes.outputs.plan }}
  verify:
    name: verify（ubuntu-latest）
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup-aoidos
        with:
          rust-components: ""
      - uses: ./.github/actions/linux-desktop-deps
      - name: Build web assets
        run: bun run build:web:assets
      - name: Build affected Tauri application
        if: needs.changes.outputs.has_app_build == 'true'
        run: bun scripts/cargo.mts build --locked --package aoidos
      - name: Affected Rust and Vitest tests
        if: needs.changes.outputs.has_rust_test == 'true' || needs.changes.outputs.has_vitest == 'true'
        uses: ./.github/actions/run-scope
        with:
          task: test
          plan: ${{ needs.changes.outputs.plan }}
      - name: Native platform and IPC tests (Linux session)
        if: needs.changes.outputs.has_native == 'true'
        timeout-minutes: 5
        uses: ./.github/actions/linux-native-session
