[workspace]
resolver = "2"
members = ["src-rust/aoidos-theme", "src-rust/aoidos-memory", "src-rust/aoidos-script", "src-rust/aoidos-json", "src-rust/aoidos-billing", "src-tauri", "src-rust/aoidos-store", "src-rust/aoidos-llm", "src-rust/aoidos-engine", "src-rust/aoidos-locale", "src-rust/aoidos-app", "src-cli", "tests/rust/native-platform"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
aho-corasick = "1.1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
rand_chacha = "0.9"
rand_core = "0.9"
getrandom = "0.4"
time = { version = "0.3", features = ["formatting", "parsing"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-window-state = "2.5.0"
tauri-build = { version = "2", features = [] }
rusqlite = { version = "0.33", features = ["bundled", "backup"] }
fs4 = "1"
aoidos-script = { path = "src-rust/aoidos-script" }
aoidos-json = { path = "src-rust/aoidos-json" }
aoidos-billing = { path = "src-rust/aoidos-billing" }
aoidos-store = { path = "src-rust/aoidos-store" }
aoidos-llm = { path = "src-rust/aoidos-llm" }
aoidos-engine = { path = "src-rust/aoidos-engine" }
aoidos-memory = { path = "src-rust/aoidos-memory" }
aoidos-theme = { path = "src-rust/aoidos-theme" }
aoidos-locale = { path = "src-rust/aoidos-locale" }
aoidos-app = { path = "src-rust/aoidos-app" }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
unicode-width = "0.2.2"
rpassword = "7.5.4"
sys-locale = "0.3.2"
jiff = { version = "0.2.38", features = ["serde"] }
rust_decimal = "1.43"
cssparser = "0.38"
aoidos = { path = "src-tauri" }
uuid = { version = "1", features = ["v4"] }
# 密钥存储：v1 默认特性 = Windows Credential Manager / macOS Keychain / Linux Secret Service（019）。
keyring = "4"
keyring-core = "1"
url = "2"
# Tauri 原生密码输入：各目标仅链接自身 UI 库，入口实现位于 src-tauri。
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAlert", "NSApplication", "NSSecureTextField", "NSTextField", "NSControl", "NSResponder", "NSView", "NSButton", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry", "NSRunLoop", "NSTimer", "block2"] }
block2 = "0.6"
gtk = "0.18"
# Windows 原生能力：CredUI 输入由 Tauri 入口使用，降级文件 DACL 由 aoidos-store 使用。
windows-sys = "0.60"
# rustls-tls 显式关闭默认特性：不要 native-tls / 自动解压；TLS backend 锁定 rustls(ring) 便于错误链分类。
# reqwest 0.13 的 rustls feature 绑定 aws-lc-rs（Windows 需 CMake+NASM），改用 no-provider + 显式安装 ring。
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider", "socks"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
secrecy = "0.10"
bytes = "1"
# rustls 作为直接依赖仅为错误链下钻分类；provider 与 reqwest / 夹具统一用 ring。
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }

# 依赖用行表级调试信息 + O1：tauri 系依赖 O0 下运行卡顿；改动本节会使依赖缓存整体失效。
[profile.dev.package."*"]
opt-level = 1
debug = "line-tables-only"

# profile 只能定义在工作区根（成员里的会被忽略）。
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
