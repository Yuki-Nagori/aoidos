[workspace]
resolver = "2"
members = ["src-tauri", "src-rust/mythos-store"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
rusqlite = { version = "0.33", features = ["bundled", "backup"] }
fs4 = "1"
mythos-store = { path = "src-rust/mythos-store" }

# 依赖用行表级调试信息 + O1：tauri 系依赖 O0 下运行卡顿；改动本节会使依赖缓存整体失效。
[profile.dev.package."*"]
opt-level = 1
debug = "line-tables-only"

# profile 只能定义在工作区根（成员里的会被忽略）。
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
