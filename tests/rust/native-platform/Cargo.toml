[package]
name = "aoidos-native-tests"
version.workspace = true
edition.workspace = true
publish = false

[features]
desktop-session = []

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true

[dev-dependencies]
reqwest.workspace = true
tokio.workspace = true
uuid.workspace = true
aoidos.workspace = true
aoidos-engine.workspace = true
aoidos-store.workspace = true
serde_json.workspace = true

aoidos-llm = { workspace = true, features = ["native-smoke"] }
secrecy.workspace = true

[[test]]
name = "native-platform"
path = "native-platform.rs"
harness = false
required-features = ["desktop-session"]

[[test]]
name = "ipc-platform"
path = "ipc-platform.rs"
harness = false
required-features = ["desktop-session"]

[[test]]
name = "product-platform"
path = "product-platform.rs"
harness = false
required-features = ["desktop-session"]

[[test]]
name = "hmr-platform"
path = "hmr-platform.rs"
harness = false
required-features = ["desktop-session"]
